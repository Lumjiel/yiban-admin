{% extends 'base.html' %}
{% block title %}登录 - 易班签到管理{% endblock %}
{% block body_pre %}{% endblock %}
{% block content %}
<style>
    /* 登录页隐藏全局 header */
    header { display: none; }
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
        -webkit-box-shadow: 0 0 0 40px var(--bg-inset) inset !important;
        -webkit-text-fill-color: var(--text) !important;
        caret-color: var(--text) !important;
        transition: background-color 9999s ease-out;
    }
</style>
<div class="login-wrap">
    <div class="login-box">
        <div class="card" style="padding:32px 28px;">
            <h2>🔐 易班签到管理</h2>
            <form method="post">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <label>用户名</label>
                <input type="text" name="username" placeholder="admin" autofocus autocomplete="username">
                <label>密码</label>
                <input type="password" name="password" placeholder="••••••••" autocomplete="current-password">
                <button type="submit" class="btn btn-primary" style="width:100%;margin-top:24px;min-height:46px;font-size:15px;">登 录</button>
            </form>
        </div>
        <p class="muted" style="text-align:center;margin-top:16px;">易班自动签到系统管理后台</p>
    </div>
</div>
{% endblock %}
