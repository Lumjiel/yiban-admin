<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}易班签到管理{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .container-wide { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { background: #1e293b; border-bottom: 1px solid #334155; padding: 16px 0; margin-bottom: 24px; }
        header .container { display: flex; align-items: center; justify-content: space-between; }
        header h1 { font-size: 20px; color: #f1f5f9; }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .header-right span { color: #64748b; font-size: 13px; }
        nav { display: flex; gap: 4px; flex-wrap: wrap; }
        nav a { color: #94a3b8; text-decoration: none; font-size: 13px; padding: 6px 12px; border-radius: 6px; transition: all .2s; white-space: nowrap; }
        nav a:hover, nav a.active { color: #f1f5f9; background: #334155; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .card h2 { font-size: 16px; color: #94a3b8; margin-bottom: 16px; font-weight: 500; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
        .stat-item { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px; }
        .stat-value { font-size: 28px; font-weight: 700; color: #f1f5f9; }
        .stat-label { font-size: 12px; color: #64748b; margin-top: 4px; }
        .stat-value.success { color: #22c55e; }
        .stat-value.danger { color: #ef4444; }
        .stat-value.warning { color: #f59e0b; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { color: #64748b; font-weight: 500; font-size: 12px; text-transform: uppercase; }
        tr:hover td { background: #0f172a; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .badge-success { background: #064e3b; color: #34d399; }
        .badge-fail { background: #7f1d1d; color: #f87171; }
        .badge-skip { background: #713f12; color: #fbbf24; }
        .badge-enable { background: #064e3b; color: #34d399; }
        .badge-disable { background: #334155; color: #64748b; }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .2s; text-decoration: none; color: #fff; }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background: #3b82f6; }
        .btn-success { background: #22c55e; }
        .btn-danger { background: #ef4444; }
        .btn-warning { background: #f59e0b; }
        .btn-secondary { background: #475569; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        input, select, textarea { width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 14px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #3b82f6; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; margin-top: 12px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .flash { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .flash-success { background: #064e3b; color: #34d399; border: 1px solid #065f46; }
        .flash-error { background: #7f1d1d; color: #f87171; border: 1px solid #991b1b; }
        .actions-cell { display: flex; gap: 6px; flex-wrap: wrap; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
        pre { background: #0f172a; padding: 16px; border-radius: 8px; font-size: 12px; overflow-x: auto; color: #94a3b8; max-height: 400px; overflow-y: auto; white-space: pre-wrap; }
        .empty { text-align: center; padding: 40px; color: #64748b; }
        .login-box { max-width: 360px; margin: 80px auto; }
        .login-box h2 { text-align: center; margin-bottom: 24px; color: #f1f5f9; }
        /* Calendar */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .cal-header { text-align: center; font-size: 12px; color: #64748b; padding: 8px 0; }
        .cal-day { aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; transition: all .15s; border: 1px solid transparent; }
        .cal-day:hover { border-color: #3b82f6; }
        .cal-day.empty { background: transparent; cursor: default; }
        .cal-day.empty:hover { border-color: transparent; }
        .cal-day .rate { font-size: 10px; margin-top: 2px; }
        .cal-0 { background: #1e293b; } /* no data */
        .cal-low { background: #7f1d1d; } /* <50% */
        .cal-mid { background: #713f12; } /* 50-80% */
        .cal-high { background: #064e3b; } /* >80% */
        .cal-perfect { background: #065f46; color: #34d399; } /* 100% */
        .cal-legend { display: flex; gap: 12px; margin-top: 16px; font-size: 12px; color: #64748b; }
        .cal-legend span { display: flex; align-items: center; gap: 4px; }
        .cal-legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
        /* SSE log */
        #sse-log { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; line-height: 1.6; white-space: pre-wrap; }
        .sse-line { padding: 1px 0; }
        .sse-info { color: #60a5fa; }
        .sse-success { color: #34d399; }
        .sse-error { color: #f87171; }
        .sse-log-line { color: #94a3b8; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>📋 易班签到管理</h1>
            <nav>
                <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">概览</a>
                <a href="{{ url_for('user_list') }}" class="{% if request.endpoint in ['user_list', 'add_user', 'edit_user', 'import_users'] %}active{% endif %}">用户</a>
                <a href="{{ url_for('calendar') }}" class="{% if request.endpoint in ['calendar', 'calendar_date'] %}active{% endif %}">日历</a>
                <a href="{{ url_for('logs') }}" class="{% if request.endpoint == 'logs' %}active{% endif %}">日志</a>
                <a href="{{ url_for('notify_config') }}" class="{% if request.endpoint in ['notify_config', 'notify_test_email', 'notify_test_serverchan'] %}active{% endif %}">通知</a>
                <a href="{{ url_for('settings') }}" class="{% if request.endpoint == 'settings' %}active{% endif %}">设置</a>
                <a href="{{ url_for('logout') }}">退出</a>
            </nav>
        </div>
    </header>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, msg in messages %}
        <div class="flash flash-{{ category }}">{{ msg }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
